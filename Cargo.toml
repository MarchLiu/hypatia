[package]
name = "hypatia"
version = "4.0.0"
edition = "2024"
license = "MIT"

[dependencies]
duckdb = { version = "1", features = ["bundled"], optional = true }
rusqlite = { version = "0.39", features = ["bundled", "functions", "backup"] }
usearch = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rustyline = "18"
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
tokenizers = "0.21"
ndarray = "0.17"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
jieba-rs = "0.8"
sha2 = "0.11"
tempfile = "3"
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"], optional = true }
pgvector = { version = "0.4", features = ["postgres"], optional = true }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }

[features]
default = []
postgres-backend = ["dep:postgres", "dep:pgvector", "dep:postgres-native-tls", "dep:native-tls"]
# Read-side support for pre-0.2 duckdb shelves (data.duckdb). Enable only
# when a legacy shelf still needs migrating; pulls the heavy duckdb build.
legacy-migration = ["dep:duckdb"]

[dev-dependencies]
rand = "0.9"

# Windows: esaxx-rs 0.1.10 硬编码 .static_crt(true)（/MT），与 ort 预编译库的
# /MD 冲突（LNK2038）。vendored 副本改为跟随 crt-static target feature。
# 见 https://github.com/huggingface/tokenizers/issues/1914
[patch.crates-io]
esaxx-rs = { path = "third_party/esaxx-rs" }
