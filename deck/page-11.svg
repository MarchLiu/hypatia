    <rect x="330" y="316" width="190" height="44" rx="8" fill="#F2A93B"/>
    <text x="532" y="344" font-size="17" fill="#3D4C66">十六份摘要 → 一份更高层摘要</text>
  </g>
  <rect x="64" y="420" width="832" height="56" rx="10" fill="#EEF2F9"/>
  <g font-family="PingFang SC,Noto Sans SC,sans-serif">
