<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#FFFFFF"/>
  <rect x="64" y="40" width="4" height="22" fill="#2F6BFF"/>
  <g font-family="PingFang SC,Noto Sans SC,sans-serif">
    <text x="78" y="57" font-size="15" fill="#7A8AA3">全景</text>
    <text x="896" y="57" font-size="15" fill="#7A8AA3" text-anchor="end">24 / 26</text>
    <text x="64" y="105" font-size="30" font-weight="700" fill="#1B2A41">从线性对话流到知识图</text>
  </g>

  <defs>
    <marker id="arr" orient="auto-start-reverse" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <path d="M0,0 L8,4 L0,8 z" fill="#7A8AA3"/>
    </marker>
  </defs>

  <g font-family="PingFang SC,Noto Sans SC,sans-serif" font-size="13.5">
    <!-- 左列：线性对话流 -->
    <text x="64" y="140" font-size="14" fill="#7A8AA3">线性对话流（随时间流逝）</text>
    <rect x="64" y="152" width="96" height="36" rx="8" fill="#EEF2F9"/>
    <text x="112" y="175" text-anchor="middle" fill="#3D4C66">轮次 1..n</text>
    <rect x="172" y="152" width="96" height="36" rx="8" fill="#EEF2F9"/>
    <text x="220" y="175" text-anchor="middle" fill="#3D4C66">轮次 n+1..m</text>
    <rect x="280" y="152" width="96" height="36" rx="8" fill="#EEF2F9"/>
    <text x="328" y="175" text-anchor="middle" fill="#3D4C66">轮次 m+1..k</text>
    <line x1="160" y1="170" x2="172" y2="170" stroke="#7A8AA3" marker-end="url(#arr)"/>
    <line x1="268" y1="170" x2="280" y2="170" stroke="#7A8AA3" marker-end="url(#arr)"/>

    <!-- 切分 -->
    <line x1="112" y1="188" x2="112" y2="222" stroke="#7A8AA3" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="122" y="212" font-size="12.5" fill="#7A8AA3">语义信号</text>
    <rect x="64" y="224" width="312" height="42" rx="8" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1.5"/>
    <text x="220" y="250" text-anchor="middle" fill="#1B2A41">Session 识别与切分（话题 / 任务 / 时间）</text>

    <!-- 分层摘要 -->
    <line x1="112" y1="266" x2="112" y2="296" stroke="#7A8AA3" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="122" y="286" font-size="12.5" fill="#7A8AA3">逐层归档</text>
    <rect x="64" y="298" width="312" height="30" rx="6" fill="#16294D"/>
    <text x="220" y="318" text-anchor="middle" fill="#FFFFFF">L2 主题摘要</text>
    <rect x="64" y="334" width="312" height="30" rx="6" fill="#2F6BFF"/>
    <text x="220" y="354" text-anchor="middle" fill="#FFFFFF">L1 会话摘要</text>
    <rect x="64" y="370" width="312" height="30" rx="6" fill="#12B5A5"/>
    <text x="220" y="390" text-anchor="middle" fill="#FFFFFF">L0 原始对话（冷存）</text>
    <path d="M 380 313 C 420 313 420 385 380 385" fill="none" stroke="#7A8AA3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text x="424" y="353" font-size="12.5" fill="#7A8AA3">下钻回溯</text>

    <!-- 中列：滑动窗口 -->
    <rect x="470" y="152" width="200" height="42" rx="8" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1.5"/>
    <text x="570" y="178" text-anchor="middle" fill="#1B2A41">滑动窗口（候选跟踪）</text>
    <line x1="570" y1="194" x2="570" y2="216" stroke="#7A8AA3" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="580" y="210" font-size="12.5" fill="#7A8AA3">窗口滑过</text>
    <rect x="470" y="218" width="200" height="42" rx="8" fill="#FFFFFF" stroke="#12B5A5" stroke-width="1.5"/>
    <text x="570" y="244" text-anchor="middle" fill="#1B2A41">知识点抽取</text>

    <!-- 右列：知识图 -->
    <rect x="716" y="152" width="180" height="150" rx="10" fill="#EEF2F9" stroke="#1B2A41" stroke-width="1.5"/>
    <text x="806" y="180" text-anchor="middle" font-weight="600" fill="#1B2A41">知识图（非线性结构）</text>
    <rect x="736" y="200" width="140" height="30" rx="6" fill="#FFFFFF" stroke="#2F6BFF"/>
    <text x="806" y="220" text-anchor="middle" fill="#1B2A41">知识点 · 自含陈述</text>
    <rect x="736" y="248" width="140" height="30" rx="6" fill="#FFFFFF" stroke="#12B5A5"/>
    <text x="806" y="268" text-anchor="middle" fill="#1B2A41">修正 / 否定（留痕）</text>
    <line x1="806" y1="230" x2="806" y2="248" stroke="#7A8AA3" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="820" y="244" font-size="12" fill="#7A8AA3">三元组</text>

    <!-- 抽取 → 知识图 -->
    <line x1="670" y1="239" x2="716" y2="228" stroke="#7A8AA3" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="668" y="258" font-size="12.5" fill="#7A8AA3">条目 + 三元组</text>

    <!-- 显式写入 → 知识图 -->
    <rect x="716" y="316" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#F2A93B" stroke-width="1.5"/>
    <text x="806" y="341" text-anchor="middle" fill="#1B2A41">显式写入（文档直接入库）</text>
    <line x1="806" y1="316" x2="806" y2="304" stroke="#F2A93B" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- 读取通道 -->
    <text x="64" y="448" font-size="14" fill="#7A8AA3">读取通道</text>
    <rect x="64" y="460" width="240" height="44" rx="8" fill="#EEF2F9"/>
    <text x="184" y="487" text-anchor="middle" fill="#1B2A41">自动回忆（按 Agent 机制适配）</text>
    <rect x="336" y="460" width="240" height="44" rx="8" fill="#EEF2F9"/>
    <text x="456" y="487" text-anchor="middle" fill="#1B2A41">显式读取（"读一下 hypatia"）</text>
    <rect x="620" y="460" width="200" height="44" rx="8" fill="#16294D"/>
    <text x="720" y="487" text-anchor="middle" fill="#FFFFFF">Agent 完成任务</text>
    <line x1="304" y1="482" x2="336" y2="482" stroke="#7A8AA3" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="576" y1="482" x2="620" y2="482" stroke="#7A8AA3" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="304" y1="415" x2="150" y2="460" stroke="#7A8AA3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <line x1="806" y1="356" x2="806" y2="460" stroke="#7A8AA3" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>
</svg>
