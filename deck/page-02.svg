    <text x="896" y="69" font-size="15" fill="#7A8AA3" text-anchor="end">02 / 26</text>
    <text x="64" y="126" font-size="34" font-weight="700" fill="#1B2A41">今天讲六件事</text>
  </g>
  <g font-family="PingFang SC,Noto Sans SC,sans-serif">
